<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ColorCover</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewrites, so a direct load or reload
      // on a client-side route (e.g. /Colorcover/game) hits this 404 page.
      // Encode the path into a query string and send the browser back to
      // index.html, which decodes it and restores the real path via
      // history.replaceState before React Router ever sees it.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
